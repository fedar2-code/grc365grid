<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<title>Surfing Grid Image</title>
<style>
    body {
        background: whitesmoke;
    } #container {
        width: 928px;
        height: 2024px;
        background: white;
        border: 1px solid dimgray;
        margin: 24px auto;
    } main {
        width: 768px;
        height: 768px;
        border: 1px dashed gray;
        margin: 36px auto;
        display: grid;
        grid-gap: 1px;
        grid-template: repeat(3, 256px) / repeat(2, 384px);
    } header img {
        width: 100%;
    } header h1 {
        font: 48pt/1.4em 'Dancing Script';
        text-align: center;
        margin-top: 24px;
        text-shadow: 2px 3px 6px goldenrod;
    } main img {
        width: 384px;
    } main img:nth-child(1) {
        grid-area: 1 / 1 / 2 / 2;
    } main img:nth-child(2) {
        grid-area: 2 / 1 / 3 / 2;
    } main img:nth-child(3) {
        grid-area: 3 / 1 / 4 / 2;
    } main img:nth-child(4) {
        grid-area: 1 / 2 / 2 / 4;
    }
</style>
</head>

<body>
    <div id="container">
        <header>
            <img src="beach-banner-og.jpg" />
            <h1>Surfing</h1>
        </header>
        <main>
            <img src="blue-green-waves.jpg" />
            <img src="aerial-view-waves.jpg" />
            <img src="landscape-waves.jpg" />
            <img style="height: 300%;" src="surfboard.jpg" />
        </main>
    </div>
</body>
</html>
